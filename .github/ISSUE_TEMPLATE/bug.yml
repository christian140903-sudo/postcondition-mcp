name: Bug report
description: Report reproducible incorrect behaviour
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private paths, private evidence, or security exploits. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options: [MCP, CLI, TypeScript SDK, Packaging, Documentation]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed verdict
    validations:
      required: true
